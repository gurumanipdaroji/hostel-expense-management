<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly History - Hostel Expense Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Reusable Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="py-4">
    <div class="container-fluid px-lg-4">

      <div id="alert-container"></div>

      <!-- Top Header -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold mb-1">Monthly Fund History</h3>
          <p class="text-muted small mb-0">Overview and comparison of hostel expenses, balances, and budgets across past months.</p>
        </div>
      </div>

      <!-- Monthly Fund Cards Grid -->
      <div class="row g-4" id="history-grid">
        <div class="col-12 text-center text-muted py-5">
          <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
          Loading past monthly funds...
        </div>
      </div>

    </div>
  </main>

  <footer class="text-center mt-auto">
    <div class="container">
      <p class="mb-0 text-muted small">Hostel Expense Management System &bull; Local Development &bull; AWS EC2 Ready</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/monthly-history.js"></script>
</body>
</html>
