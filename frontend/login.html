<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hostel Expense Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none d-inline-flex align-items-center text-primary fs-3 fw-bold">
        <i class="bi bi-wallet2 me-2"></i> Hostel Expense System
      </a>
      <p class="text-muted mt-1">Sign in to manage your hostel funds and expenses</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5" style="max-width: 440px; width: 100%;">
      <h3 class="fw-bold mb-4">Welcome Back</h3>

      <div id="alert-container"></div>

      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="student@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between">
            <label for="password" class="form-label fw-semibold">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-semibold">
          <span id="btn-text">Sign In</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>

      <div class="mt-4 text-center">
        <span class="text-muted">Don't have an account?</span>
        <a href="register.html" class="text-primary fw-semibold text-decoration-none">Register here</a>
      </div>

      <!-- Quick Fill for Demo / Testing -->
      <div class="mt-4 pt-3 border-top">
        <p class="small text-muted mb-2 text-center fw-semibold">Quick Demo Logins (Password: password123):</p>
        <div class="d-flex flex-wrap gap-1 justify-content-center">
          <button type="button" class="btn btn-outline-secondary btn-sm py-1 px-2" onclick="quickFill('studenta@hostel.com')">Student A (Admin/Holder)</button>
          <button type="button" class="btn btn-outline-secondary btn-sm py-1 px-2" onclick="quickFill('studentb@hostel.com')">Student B</button>
          <button type="button" class="btn btn-outline-secondary btn-sm py-1 px-2" onclick="quickFill('studentc@hostel.com')">Student C</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
