<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Hostel Expense Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none d-inline-flex align-items-center text-primary fs-3 fw-bold">
        <i class="bi bi-wallet2 me-2"></i> Hostel Expense System
      </a>
      <p class="text-muted mt-1">Create your student account</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5" style="max-width: 460px; width: 100%;">
      <h3 class="fw-bold mb-4">Register</h3>

      <div id="alert-container"></div>

      <form id="register-form">
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="name" placeholder="Student Name" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="student@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="At least 4 characters" required minlength="4">
          </div>
        </div>

        <div class="mb-4">
          <label for="confirm-password" class="form-label fw-semibold">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="confirm-password" placeholder="Repeat password" required minlength="4">
          </div>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary w-100 py-2 fw-semibold">
          <span id="btn-text">Create Account</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>

      <div class="mt-4 text-center">
        <span class="text-muted">Already have an account?</span>
        <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign in</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
